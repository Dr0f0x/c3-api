name: Zip and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for debug builds (defaults to project.json)"
        required: false
        type: string

jobs:

  package-and-zip:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          version="$VERSION_OVERRIDE"
          if [ -z "$version" ]; then
            version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' project.json | head -n1)
          fi
          if [ -z "$version" ]; then
            echo "Unable to determine version from project.json" >&2
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z._+-]+$'; then
            echo "Invalid version '$version': use only letters, digits, '.', '_', '+', and '-'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Move files to src directory
        run: |
          find src -type f -mindepth 2 -exec mv {} src/ \;
          find src -type d -empty -delete

      - name: Copy manifest.json into src
        run: cp manifest.json src/manifest.json

      - name: Zip src contents to top-level c3api.c3l
        run: |
          cd src
          zip -r ../c3api.c3l ./*

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: src-zip
          path: c3api.c3l

  release:
    runs-on: ubuntu-latest
    needs: [package-and-zip]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Determine Tag Version
        id: determine_tag
        env:
          VERSION: ${{ needs.package-and-zip.outputs.version }}
        run: |
          echo "TAG_VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Download zip artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: src-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_VERSION" c3api.c3l \
            --target "$GITHUB_SHA" \
            --title "Release $TAG_VERSION" \
            --notes ""
