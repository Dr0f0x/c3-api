site_name: C3 API
site_description: A lightweight HTTP web framework for the C3 programming language.
repo_url: https://github.com/Dr0f0x/c3-api
repo_name: Dr0f0x/c3-api
edit_uri: https://github.com/Dr0f0x/c3-api/edit/main/docs/

theme:
  name: material
  custom_dir: docs/theme
  logo: c3api_logo.svg
  favicon: c3api_logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - header.autohide
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

hooks:
  - docs/hooks/c3_lexer.py
  - docs/hooks/clean_html.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page

nav:
  - Introduction: index.md                      # replace boilerplate
  - Quickstart: quickstart.md                   # replace boilerplate
  - Configuration:
      - Overview: configuration/overview.md     # conf file, defaults, load/write API
      - Server & HTTP: configuration/server_http.md   # address/port/backlog, keep-alive, trace, max_read_size
      - CORS: configuration/cors.md             
      - Concurrency Mode: configuration/concurrency_mode.md   # exists, empty
      - Logging: configuration/logging.md       # console/file keys
  - Routing:
      - HTTP Methods: routing/http_methods.md
      - Path & Query Parameters: routing/parameters.md
      - Middleware: routing/middleware.md
      - Groups: routing/groups.md
      - Static Files: routing/static_files.md   
  - Requests & Responses:
      - Request: http/request.md                # headers, body, cookie read link
      - Response: http/response.md              # status, body helpers, cookie write link
      - Encoding:
          - Struct Binding: http/encoding/binding.md     # @Json/@Xml/@Form
          - JSON: http/encoding/json.md                  
          - XML: http/encoding/xml.md                    
          - Forms: http/encoding/forms.md 
      - Cookies: http/cookies.md                               
  - Logging:
      - Sinks & Encoders: logging/sinks.md      # custom sink/encoder, rotating-file example
  - Examples: examples/index.md                 # table mirroring examples/basic/* + todo
  - API Reference: https://dr0f0x.github.io/c3-api/api-reference/